[package]
name = "ide-workspace-chat"
version = "1.0.0"
description = "Chat de escritorio para agentes CLI"
edition = "2021"

[lib]
name = "ide_workspace_chat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
notify-debouncer-mini = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "sync", "macros", "rt-multi-thread"] }
futures = "0.3"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dirs = "7"
sha1_smol = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
